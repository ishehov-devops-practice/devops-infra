apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-stack
  namespace: argocd
spec:
  project: default

  source:
    repoURL: 'https://github.com/ishehov-devops-practice/devops-infra.git'
    targetRevision: HEAD
    path: kubernetes/platform
    directory:
      recurse: true

  destination:
    server: 'https://kubernetes.default.svc'
    namespace: platform

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true