apiVersion: apps/v1
kind: Deployment

metadata:
  name: api-golang
  namespace: platform

spec:
  replicas: 2

  selector:
    matchLabels:
      app: api-golang

  template:
    metadata:
      labels:
        app: api-golang

    spec:
      imagePullSecrets:
        - name: ghcr-secret

      containers:
        - name: api-golang

          image: ghcr.io/ishehov-devops-practice/api-golang:sha-275627e657a245dafd55fce81e188e15817c8a7d
          imagePullPolicy: Always

          ports:
            - containerPort: 8080

          env:
            - name: _DB_USER
              valueFrom:
                secretKeyRef:
                  name: apis-postgres-secret
                  key: DB_USER
            - name: _DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: apis-postgres-secret
                  key: DB_PASSWORD
            - name: _DB_HOST
              valueFrom:
                secretKeyRef:
                  name: apis-postgres-secret
                  key: DB_HOST
            - name: _DB_NAME
              valueFrom:
                secretKeyRef:
                  name: apis-postgres-secret
                  key: DB_NAME

            - name: DATABASE_URL
              value: "postgres://$(_DB_USER):$(_DB_PASSWORD)@$(_DB_HOST):5432/$(_DB_NAME)?sslmode=disable"

          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 5
            successThreshold: 1
            failureThreshold: 3

          # livenessProbe intentionally omitted for api-golang (I'm lazy and I don't want to write health endpoint rn)

          resources:
            requests:
              cpu: 100m
              memory: 128Mi

            limits:
              cpu: 250m
              memory: 256Mi